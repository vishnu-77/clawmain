name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Catalog valid and generated files up to date
        run: python tools/build.py --check
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Manifests are valid JSON
        run: |
          python -c "import json,glob; [json.load(open(p)) for p in ['.claude-plugin/marketplace.json', *glob.glob('plugins/*/.claude-plugin/plugin.json')]]; print('ok')"
